spring.application.name=transaction-service

server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/banking_transaction
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# OpenFeign Circuit Breaker
spring.cloud.openfeign.circuitbreaker.enabled=false
spring.cloud.loadbalancer.retry.enabled=false


# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.accountService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.accountService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.accountService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.accountService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.accountService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.accountService.recordExceptions=java.lang.RuntimeException

# Resilience4j Retry Configuration
resilience4j.retry.instances.accountService.maxAttempts=3
resilience4j.retry.instances.accountService.waitDuration=2s
resilience4j.retry.instances.accountService.retryExceptions=java.lang.Exception

# Resilience4j TimeLimiter Configuration
resilience4j.timelimiter.instances.accountService.timeoutDuration=3s
resilience4j.timelimiter.instances.accountService.cancelRunningFuture=true

# TimeLimiter Debug Logging
logging.level.io.github.resilience4j.timelimiter=TRACE

# Exponential Backoff
resilience4j.retry.instances.accountService.enableExponentialBackoff=true
resilience4j.retry.instances.accountService.exponentialBackoffMultiplier=2

# Debug Logging
logging.level.io.github.resilience4j=DEBUG
logging.level.io.github.resilience4j.retry=TRACE
logging.level.io.github.resilience4j.circuitbreaker=TRACE

logging.level.org.springframework.cloud.openfeign=DEBUG
logging.level.feign=DEBUG
logging.level.feign.Logger=DEBUG

# OpenFeign HTTP Client Timeout
spring.cloud.openfeign.client.config.account-service.connectTimeout=1000
spring.cloud.openfeign.client.config.account-service.readTimeout=2500

# Resilience4j RateLimiter Configuration
resilience4j.ratelimiter.instances.accountService.limitForPeriod=5
resilience4j.ratelimiter.instances.accountService.limitRefreshPeriod=10s
resilience4j.ratelimiter.instances.accountService.timeoutDuration=0s

# RateLimiter Debug Logging
logging.level.io.github.resilience4j.ratelimiter=TRACE
